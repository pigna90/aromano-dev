name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]  # or master, depending on your default branch name

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `npm ci` fetches Puppeteer's pinned Chrome build, but the cache is keyed
      # on the lockfile, so a cache hit skips the postinstall that downloads it.
      # This makes the browser the prerender step needs present either way.
      - name: Install Chrome for prerendering
        run: npx puppeteer browsers install chrome

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 