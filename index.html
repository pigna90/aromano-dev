<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />
    <link rel="apple-touch-icon" href="/images/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1e6" />
    <link rel="shortcut icon" href="/images/favicon.ico" />

    <title>Alessandro Romano | Data Scientist/AI Engineer, Speaker, Mentor</title>
    <meta
      name="description"
      content="Alessandro Romano is a senior data scientist and AI engineer who speaks at conferences worldwide on agentic AI, LLMs, forecasting and dynamic pricing, and mentors data scientists and AI engineers. Co-host of the My Data Guest podcast."
    />
    <meta name="author" content="Alessandro Romano" />
    <link rel="canonical" href="https://www.aromano.dev/" />

    <!-- Open Graph: without these, every share of this site on LinkedIn renders
         as a bare URL with no title, description or image. -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Alessandro Romano" />
    <meta property="og:url" content="https://www.aromano.dev/" />
    <meta
      property="og:title"
      content="Alessandro Romano | Data Scientist/AI Engineer, Speaker, Mentor"
    />
    <meta
      property="og:description"
      content="Senior data scientist and AI engineer. Speaker at PyCon, NDC, ODSC and Data Innovation Summit on agentic AI, LLMs and forecasting. Mentor to data scientists and AI engineers."
    />
    <meta
      property="og:image"
      content="https://www.aromano.dev/og-image-datahack-2026.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Alessandro Romano speaking on stage at DataHack Summit 2026 in Bengaluru"
    />
    <meta property="og:locale" content="en_US" />
    <meta property="profile:first_name" content="Alessandro" />
    <meta property="profile:last_name" content="Romano" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Alessandro Romano | Data Scientist/AI Engineer, Speaker, Mentor"
    />
    <meta
      name="twitter:description"
      content="Senior data scientist and AI engineer. Speaker at PyCon, NDC, ODSC and Data Innovation Summit on agentic AI, LLMs and forecasting. Mentor to data scientists and AI engineers."
    />
    <meta
      name="twitter:image"
      content="https://www.aromano.dev/og-image-datahack-2026.jpg"
    />

    <!-- The hero portrait is the LCP element on nearly every viewport, so it is
         worth fetching before the bundle has finished parsing. -->
    <link
      rel="preload"
      as="image"
      href="/images/profile/headshot.webp"
      type="image/webp"
      fetchpriority="high"
    />

    <!-- Analytics is loaded after the page is interactive: in <head> it was
         blocking the critical path for a script that measures the very load it
         was slowing down. The consent flag still has to be set up front, before
         any gtag call can queue a hit. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      if (localStorage.getItem('cookieConsent') === 'declined') {
        window['ga-disable-G-53PTGD76C5'] = true;
      }
      window.addEventListener('load', function () {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-53PTGD76C5';
        document.head.appendChild(s);
        gtag('js', new Date());
        gtag('config', 'G-53PTGD76C5');
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
