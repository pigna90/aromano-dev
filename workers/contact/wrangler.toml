# Contact form Worker. See index.js for what it does and how to deploy.
name = "aromano-contact"
main = "index.js"
compatibility_date = "2026-11-01"

# Reachable only on the site's own domain, never on a public workers.dev URL.
workers_dev = false
routes = [
  { pattern = "www.aromano.dev/api/contact", zone_name = "aromano.dev" },
  { pattern = "aromano.dev/api/contact", zone_name = "aromano.dev" },
]

# Sends through Email Routing. The recipient comes from the CONTACT_TO
# secret and has to be a verified destination address.
[[send_email]]
name = "MAILER"

# Five messages per minute per visitor IP.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
